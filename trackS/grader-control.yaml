# Grader control set — the calibration of the Track S grader (decision register D-53).
#
# Each case is an answer written for a question of persona-control.yaml, with the verdict the rules
# of procedure.md give it. The grader sees the case's role's slice, kind, question and expect, and the
# answer; never `verdict` or `contradicts`. It passes when it agrees with at least 33 of the 36
# verdicts and passes no case marked `contradicts: true`. Per question: one answer that passes, and
# two that fail for the reasons the persona's runs failed — an addition, a guess or referral, a
# design, a claim for another organisation, or a contradiction.

