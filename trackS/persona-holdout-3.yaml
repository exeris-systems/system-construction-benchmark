# Persona held-out set 3 — the deciding calibration of the draft 5 persona (decision register D-52).
#
# Same shape, kinds and pass rules as persona-control.yaml. It shares no question with the control
# set or with the two earlier held-out sets, which have been seen. Run once, with the persona prompt,
# check prompt and model of draft 5; its verdict decides (procedure.md).
# `expect` states what the slice supports; `kind` says which property the question probes:
#   fact      — the slice answers it; the answer must agree with the cited unit
#   outside   — the slice does not; the persona must not invent an answer
#   no-design — the persona must describe needs, not features or mechanisms

technician:
  - id: KT1
    kind: fact
    question: Can you take a drone out of service, and later bring it back?
    expect: yes — technicians take drones out of service for repairs and put them back (2.b1)
  - id: KT2
    kind: fact
    question: Where does each of your drones belong?
    expect: each drone has a home site (3.b2)
  - id: KT3
    kind: fact
    question: Who flies the drones while they are in the air?
    expect: the drones fly on their own autopilots; people on the ground supervise, and nobody steers one through the service (6.b1)
  - id: KT4
    kind: fact
    question: Which rules does your work fall under?
    expect: the EU drone operation rules (Implementing Regulation (EU) 2019/947) and the EU U-space rules (Implementing Regulation (EU) 2021/664); staff personal data falls under the GDPR (5.b3)
  - id: KT5
    kind: fact
    question: Do the companies want the service to send alerts to staff by e-mail or text message?
    expect: no — each company's own systems take care of reaching people (8.b7)
  - id: KT6
    kind: outside
    question: How much does a new drone cost?
    expect: does not know (no price in the technician slice)
  - id: KT7
    kind: outside
    question: How does the airspace desk group the corridors into zones?
    expect: does not know, or refers to the airspace desk (2.b3 is not in the technician slice)
  - id: KT8
    kind: no-design
    question: What should the service show you when a charging pad stops responding?
    expect: describes what it needs to know and what worries it, proposes no screens, alerts, features or mechanisms

dispatcher:
  - id: KD1
    kind: fact
    question: What has to happen before one of your flights leaves?
    expect: the dispatcher signs it off (2.b2)
  - id: KD2
    kind: fact
    question: In what order does an inspection drone visit its points, and where does it end up?
    expect: in a set order, then back to where the inspection started (4.b2)
  - id: KD3
    kind: fact
    question: Where is radio contact with the drones worst?
    expect: around ports, industrial sites, and in bad weather (6.b2)
  - id: KD4
    kind: fact
    question: Do the companies want the service to plan routes for them?
    expect: no — software that plans routes or picks drones is among what the companies do not want (8.b8)
  - id: KD5
    kind: fact
    question: Can you fly a drone by hand through the service?
    expect: no — nobody steers a drone through the service, and the companies do not want remote flying through it (6.b1, 8.b9)
  - id: KD6
    kind: outside
    question: Which clients does the infrastructure inspection firm work for?
    expect: does not know (another company's business; no such detail in the dispatcher slice)
  - id: KD7
    kind: outside
    question: How long does it take a technician to set up a new charging pad?
    expect: does not know, or refers to the technicians (2.b1 is not in the dispatcher slice)
  - id: KD8
    kind: no-design
    question: What should the service do when a closure comes into force while one of your drones is flying?
    expect: describes the situation and what it needs to know or decide, proposes no alerts, screens, features or mechanisms

desk:
  - id: KA1
    kind: fact
    question: Is the airspace information different for each company?
    expect: no — it comes from the authorities and is the same for everyone (1.p2)
  - id: KA2
    kind: fact
    question: Can a closure change after it has been announced?
    expect: yes — closures are often amended during the day, for example an area widened or an end time moved (5.b1)
  - id: KA3
    kind: fact
    question: Do the companies want the service backed up or spread over several servers?
    expect: no — backups, high availability and several servers are among what they do not want (8.b5)
  - id: KA4
    kind: fact
    question: Who gives staff their accounts for the service?
    expect: the platform company, outside the service (8.b6)
  - id: KA5
    kind: outside
    question: How often do the parcel firm's drones restart in flight?
    expect: does not know, or says it is the company's own business (6.b3 is not in the desk slice)
  - id: KA6
    kind: outside
    question: How many charging pads does the hospital logistics firm have?
    expect: does not know, or says it is the company's own business (3.b2 is not in the desk slice)
  - id: KA7
    kind: outside
    question: Which corridor did the parcel firm use most last week?
    expect: does not know, or says the desk has no business looking into one company's operations (2.b3)
  - id: KA8
    kind: no-design
    question: What should the service do when the authorities announce a sudden closure?
    expect: describes what it needs to know and how soon, proposes no alerts, screens, features or mechanisms
