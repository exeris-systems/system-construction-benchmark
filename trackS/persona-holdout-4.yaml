# Persona held-out set 4 — the deciding calibration of the draft 6 persona (decision register D-53).
#
# Same shape, kinds and pass rules as persona-control.yaml. It shares no question with the control
# set or with the three earlier held-out sets, which have been seen. Run once, with the persona
# prompts and model of draft 6, and graded by the calibrated grader; its verdict decides (procedure.md).
# `expect` states what the slice supports; `kind` says which property the question probes:
#   fact      — the slice answers it; the answer must agree with the cited unit
#   outside   — the slice does not; the persona must not invent an answer
#   no-design — the persona must describe needs, not features or mechanisms

technician:
  - id: LT1
    kind: fact
    question: Do all your drones use the same charging connector?
    expect: no — several connector types are in use, and they are not interchangeable (3.b1)
  - id: LT2
    kind: fact
    question: Who sets up the charging pads at your company's sites?
    expect: the fleet technicians (2.b1)
  - id: LT3
    kind: fact
    question: Does anyone watch every drone all the time?
    expect: no — nobody watches every drone at every moment; one person may be responsible for hundreds (6.b5)
  - id: LT4
    kind: fact
    question: Do the companies want the service to guarantee that they meet the regulations?
    expect: no — they want no guarantee of meeting regulations and no compliance audit (8.b4)
  - id: LT5
    kind: fact
    question: What can go wrong with the links you use to instruct the charging equipment?
    expect: they are unreliable; an instruction may get through twice, and the sender often cannot tell whether the first attempt arrived (6.b6)
  - id: LT6
    kind: outside
    question: Which manufacturer makes most of your drones?
    expect: does not know (the slice names no manufacturer)
  - id: LT7
    kind: outside
    question: How many flights does a dispatcher plan in a day?
    expect: does not know, or refers to the dispatchers (no such figure in the technician slice)
  - id: LT8
    kind: no-design
    question: How should the service keep track of which drones are out for repairs?
    expect: describes what it needs to know and what worries it, proposes no records, screens, features or mechanisms

dispatcher:
  - id: LD1
    kind: fact
    question: Who reports that a drone has reached the points of its job?
    expect: people and devices outside the company (4.b6)
  - id: LD2
    kind: fact
    question: Do your drones ever restart while they are flying?
    expect: yes — sometimes, after a software fault, and they carry on (6.b3)
  - id: LD3
    kind: fact
    question: What do your company's own systems need from the service?
    expect: to hear about what happens to its drones and jobs; billing and customer updates are examples (7.b2)
  - id: LD4
    kind: fact
    question: Do the companies want the service in several languages?
    expect: no — several languages are among what the companies do not want (8.b3)
  - id: LD5
    kind: fact
    question: Can a closure begin while your drones are flying?
    expect: yes — a closure can come into force while drones of several companies are already in the air (5.b2)
  - id: LD6
    kind: outside
    question: How does the airspace desk measure the disruption a closure causes?
    expect: does not know, or refers to the airspace desk (2.b3 is not in the dispatcher slice)
  - id: LD7
    kind: outside
    question: Which sites does the hospital logistics firm fly from?
    expect: does not know (another company's business; no such detail in the dispatcher slice)
  - id: LD8
    kind: no-design
    question: How should the service help you find which of your drones could reach the start of a job?
    expect: describes what it needs to know to decide, proposes no searches, screens, features or mechanisms

desk:
  - id: LA1
    kind: fact
    question: Who announces the closures you deal with?
    expect: the authorities (5.b1, 2.b3)
  - id: LA2
    kind: fact
    question: Must the service keep data for a set time, or delete it when asked?
    expect: no — the companies want no data-retention or deletion features (8.b4)
  - id: LA3
    kind: fact
    question: Can a closure affect drones that are already in the air?
    expect: yes — it can come into force while drones of several companies are already flying (5.b2)
  - id: LA4
    kind: fact
    question: Whom does the airspace desk work for?
    expect: all the customer companies (2.b3)
  - id: LA5
    kind: outside
    question: What sensors do the inspection firm's drones carry?
    expect: does not know, or says it is the company's own business (3.b1 is not in the desk slice)
  - id: LA6
    kind: outside
    question: How long does a dispatcher take to sign off a flight?
    expect: does not know (2.b2 is not in the desk slice)
  - id: LA7
    kind: outside
    question: How many staff does the hospital logistics firm employ?
    expect: does not know, or says it is the company's own business (no such figure in the desk slice)
  - id: LA8
    kind: no-design
    question: How should the service show which corridors a closure affects?
    expect: describes what it needs to know or keep up to date, proposes no maps, screens, features or mechanisms
