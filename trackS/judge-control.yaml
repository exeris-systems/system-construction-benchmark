additions:
  - id: I1
    class: other
    after: DR-08
    requirement: The service keeps each drone's firmware version and refuses a mission for a drone whose firmware is older than the minimum its model requires.
  - id: I2
    class: other
    after: DR-02
    requirement: A dispatcher gives each mission one of three priorities, and a mission of higher priority takes a contested take-off slot from one of lower priority.
  - id: I3
    class: other
    after: DR-15
    requirement: Each charging pad counts the charge cycles it has delivered, and its record shows it as due for maintenance once it passes 5,000 cycles.
  - id: I4
    class: other
    after: DR-23
    requirement: A mission that has waited for approval for more than 24 hours is cancelled automatically.
  - id: I5
    class: other
    after: DR-30
    requirement: The service must be reliable and easy to use.
  - id: I6
    class: other
    after: DR-36
    requirement: The service must handle every situation correctly and keep the companies satisfied.
  - id: U1
    class: user_visible
    after: DR-05
    requirement: At the end of each month the service produces, for each company's management, a report of the flights its drones made.
  - id: U2
    class: user_visible
    after: DR-24
    requirement: Staff log in through their own company's identity provider.
  - id: U3
    class: user_visible
    after: DR-21
    requirement: When a drone's battery becomes critical, the service sends a text message to the dispatcher on duty.
  - id: U4
    class: user_visible
    after: DR-35
    requirement: The service invoices each company every month for the deliveries and inspections its drones flew.
  - id: T1
    class: technical
    after: DR-17
    requirement: The parts of the service exchange their events through a message broker.
  - id: T2
    class: technical
    after: DR-29
    requirement: The current state of each drone is held in a second-level cache in front of the store.
  - id: T3
    class: technical
    after: DR-10
    requirement: The service adds instances automatically when the telemetry load rises.

