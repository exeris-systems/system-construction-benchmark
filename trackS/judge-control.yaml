# Judge control set — the contracts of known coverage that calibrate each judge (decision register D-48, D-55, D-61).
#
# Never given to a judge as it stands: the script builds each mutant's contract from these entries and
# sends only its items, renumbered DR-01, DR-02, … in their order, so neither the numbering nor the
# position of an item tells which item was removed, added or shortened.
#
#   base       a derived contract that covers every reference requirement of
#              trackS/brief-requirements.yaml, each item reworded from the one it `covers`
#   partials   a base item with one obligation of its requirement left out
#   additions  an item no reference requirement asks for, of a known class: user_visible (an
#              anti-requirement of contract/anti-requirements.md that brief §8 states), technical (a
#              technical anti-requirement), or other; each is placed `after` a base item
#   mutants    a contract built from the base: `remove` drops base items (`all` drops every one),
#              `partial` swaps base items for their partials, `add` places additions
#
# A judge is expected to report, for each mutant, every reference requirement as covered, partial
# or missing, and every item's class, exactly as these entries make them.

base:
  - id: DR-01
    covers: BR-25
    requirement: People and devices outside an operating company can report to the service that a flight's load is ready, that its drone has got to one of the job's points, or that the drone has arrived; the service takes each such report and records it on the flight it concerns.
  - id: DR-02
    covers: BR-15
    requirement: To plan a flight for a job, a dispatcher picks the drone and the way it flies, given as a sequence of corridors that run between named sites.
  - id: DR-03
    covers: BR-01
    requirement: Several independent operating companies use the service side by side. A company's drones, drone models, sites, pads, jobs, flights and the history of all of these are visible and changeable to its own staff and to no one else.
  - id: DR-04
    covers: BR-11
    requirement: Technicians can put a drone on charge; the service accepts only a pad with the same connector type as the drone's model and turns the request down for any other pad.
  - id: DR-05
    covers: BR-17
    requirement: When a dispatcher asks, the service lists those of the dispatcher's own company's drones that are able to reach the place where a given job begins.
  - id: DR-06
    covers: BR-31
    requirement: The desk can enter closures of two kinds: planned ones, with a start time and an end time, and sudden ones, in force immediately. It can change a closure after entering it, for instance by widening its area or moving its end time, and the change counts from the moment it is entered.
  - id: DR-07
    covers: BR-21
    requirement: Sign-off is refused when the flight's way crosses a zone where flying is prohibited, or crosses a closure that is in force at any moment of the flight.
  - id: DR-08
    covers: BR-05
    requirement: Technicians add drones to their company's fleet, each with its model. For every model the service keeps its carrying capacity, its range on a full battery, the sensors it carries and its charging connector type.
  - id: DR-09
    covers: BR-36
    requirement: Every instruction the service gives a drone or charging equipment has its effect only once: also when the link delivers it twice, and when the service repeats it because it could not tell whether the first one got through.
  - id: DR-10
    covers: BR-03
    requirement: Each member of staff has one role: fleet technician or dispatcher at an operating company, or the airspace desk at the platform company. An action is allowed only to the role these requirements assign it to.
  - id: DR-11
    covers: BR-28
    requirement: If a report a flight expects, its arrival for instance, does not come when it should, the dispatchers of the flight's company get the flight flagged to them.
  - id: DR-12
    covers: BR-13
    requirement: Dispatchers can enter a delivery job: a load that has to go from one site to another.
  - id: DR-13
    covers: BR-34
    requirement: After a closure is entered, the desk can see the disruption it caused across all customers, as totals only, naming no company and showing no company's flights.
  - id: DR-14
    covers: BR-09
    requirement: Technicians can set up a charging pad, with its connector type, at a site of their own company.
  - id: DR-15
    covers: BR-20
    requirement: A flight is not signed off when its drone is not up to the job: the load weighs more than the drone's model can carry, the way is longer than the model's range, or an inspection needs a sensor the model lacks.
  - id: DR-16
    covers: BR-07
    requirement: A technician can retire a drone. Once retired, it remains in the company's history but is never again given a flight or sent to charge.
  - id: DR-17
    covers: BR-23
    requirement: If several dispatchers at once sign off flights that would put the same drone on overlapping times, exactly one sign-off goes through, and each of the others is refused with the reason.
  - id: DR-18
    covers: BR-38
    requirement: There is no way to steer a drone through the service.
  - id: DR-19
    covers: BR-02
    requirement: All companies share one airspace picture, made of the corridors between sites, the zones grouping them, the prohibited zones and the closures, and the staff of every company can see the whole of it.
  - id: DR-20
    covers: BR-32
    requirement: On every new or amended closure, the dispatchers of each company are told which of their own flights it affects, those in the air included, and no company is told about another company's flights.
  - id: DR-21
    covers: BR-27
    requirement: Reports are applied in the order the events happened, not the order in which they arrived, so a report that comes late or out of turn never undoes a later one.
  - id: DR-22
    covers: BR-10
    requirement: Only drones of the company that owns a charging pad may use it.
  - id: DR-23
    covers: BR-14
    requirement: Dispatchers can enter an inspection job: the sensors it needs and the points to visit in a fixed order, finishing where the inspection began.
  - id: DR-24
    covers: BR-30
    requirement: The desk can record corridors running between named sites, zones made up of corridors, and the zones in which the authorities forbid flying.
  - id: DR-25
    covers: BR-19
    requirement: A dispatcher can call off a flight.
  - id: DR-26
    covers: BR-35
    requirement: The service may restart or crash while drones are in the air; when it is back, it continues from where it was, with nothing it had recorded lost and nothing applied a second time.
  - id: DR-27
    covers: BR-06
    requirement: Every drone has a home site, which is one of its own company's sites.
  - id: DR-28
    covers: BR-24
    requirement: In deciding whether a drone can fly a way, the service does not rely on the whole range of a full battery, because cold and wind drain batteries faster than planned.
  - id: DR-29
    covers: BR-12
    requirement: For every drone the service records each time it was taken out of service, repaired or serviced, and returned to service, and who did it, so that its company can show a regulator how the drone was looked after.
  - id: DR-30
    covers: BR-33
    requirement: A closure never leads the service to call off, reroute or otherwise change a flight on its own; only the dispatcher decides that.
  - id: DR-31
    covers: BR-18
    requirement: No flight departs until a dispatcher has signed it off, and only a dispatcher's own action can sign a flight off.
  - id: DR-32
    covers: BR-04
    requirement: The airspace desk has no view of any single company's drones, jobs or flights.
  - id: DR-33
    covers: BR-37
    requirement: Each company's own systems are informed of what happens to that company's drones and jobs, and told nothing about any other company's.
  - id: DR-34
    covers: BR-22
    requirement: At no time does a site have more drones taking off or landing than it has places for.
  - id: DR-35
    covers: BR-08
    requirement: A technician can take a drone out of service for repair and return it to service; while it is out of service, the drone cannot be given a flight.
  - id: DR-36
    covers: BR-29
    requirement: When a drone restarts in the air and carries on, it is still on the same flight, and the reports it sends after the restart count for that flight.
  - id: DR-37
    covers: BR-16
    requirement: The service never picks a drone or a way for a flight, and never replaces the one the dispatcher chose.
  - id: DR-38
    covers: BR-26
    requirement: A report received more than once takes effect only once.

partials:
  - id: DR-01
    requirement: People and devices outside an operating company can report to the service that a flight's load is ready or that its drone has got to one of the job's points; the service takes each such report and records it on the flight it concerns.
  - id: DR-02
    requirement: To plan a flight for a job, a dispatcher picks the drone that flies it.
  - id: DR-06
    requirement: The desk can enter closures of two kinds: planned ones, with a start time and an end time, and sudden ones, in force immediately.
  - id: DR-08
    requirement: Technicians add drones to their company's fleet, each with its model. For every model the service keeps its carrying capacity, its range on a full battery and the sensors it carries.
  - id: DR-15
    requirement: A flight is not signed off when its drone is not up to the job: the load weighs more than the drone's model can carry, or the way is longer than the model's range.
  - id: DR-35
    requirement: A technician can take a drone out of service for repair and return it to service.

additions:
  - id: I1
    class: other
    after: DR-08
    requirement: The service keeps each drone's firmware version and refuses to sign off a flight for a drone whose firmware is older than the minimum its model requires.
  - id: I2
    class: other
    after: DR-02
    requirement: A dispatcher gives each job one of three priorities, shown beside it in every list of jobs.
  - id: I3
    class: other
    after: DR-14
    requirement: Each charging pad counts the charge cycles it has delivered, and its record shows it as due for maintenance once it passes 5,000 cycles.
  - id: I4
    class: other
    after: DR-23
    requirement: A flight that has waited more than 24 hours for sign-off is called off automatically.
  - id: I5
    class: other
    after: DR-30
    requirement: The service must be reliable and easy to use.
  - id: I6
    class: other
    after: DR-36
    requirement: The service must handle every situation correctly and keep the companies satisfied.
  - id: U1
    class: user_visible
    after: DR-05
    requirement: At the end of each month the service produces, for each company's management, a report of the flights its drones made.
  - id: U2
    class: user_visible
    after: DR-24
    requirement: Staff log in through their own company's identity provider.
  - id: U3
    class: user_visible
    after: DR-21
    requirement: When a drone's battery runs low, the service sends a text message to the dispatcher on duty.
  - id: U4
    class: user_visible
    after: DR-35
    requirement: The service invoices each company every month for the deliveries and inspections its drones flew.
  - id: T1
    class: technical
    after: DR-17
    requirement: The parts of the service exchange their events through a message broker.
  - id: T2
    class: technical
    after: DR-29
    requirement: The current state of each drone is held in a second-level cache in front of the store.
  - id: T3
    class: technical
    after: DR-10
    requirement: The service adds instances automatically when the load of incoming reports rises.

