# Mechanical partition of world-brief.md into persona slices (decision register D-47).
#
# A unit is a paragraph (p) or a bullet (b) of a brief section, numbered in order of appearance;
# bold sub-headings are structure, not units. Each unit is given verbatim to the roles listed
# for it. No text is added: a slice is a selection of brief units, so brief-seeding.md applies
# to every slice unchanged. run-track-s.py refuses to run if a unit is missing from this file
# or the brief has a unit this file does not list.
#
# Roles: technician (fleet technician), dispatcher, desk (airspace desk).
# The interviewer receives §1 only; the analyst receives no brief units.

interviewer: ["1.p1", "1.p2"]

units:
  "1.p1": [technician, dispatcher, desk]
  "1.p2": [technician, dispatcher, desk]

  "2.b1": [technician]                       # fleet technicians
  "2.b2": [dispatcher]                       # dispatchers
  "2.b3": [desk]                             # airspace desk

  "3.b1": [technician, dispatcher]           # fleet composition
  "3.b2": [technician, dispatcher]           # home sites, pads
  "3.b3": [technician]                       # repairs, regulators

  "4.b1": [technician, dispatcher]           # deliveries
  "4.b2": [technician, dispatcher]           # inspections
  "4.b3": [dispatcher, desk]                 # corridors, take-off and landing places
  "4.b4": [dispatcher]                       # choice of drone and way
  "4.b5": [dispatcher]                       # concurrent planning
  "4.b6": [dispatcher]                       # outside events

  "5.b1": [dispatcher, desk]                 # zones, closures, amendments
  "5.b2": [dispatcher, desk]                 # closure while drones fly
  "5.b3": [technician, dispatcher, desk]     # regulations

  "6.b1": [technician, dispatcher, desk]     # autopilots, supervision
  "6.b2": [technician, dispatcher]           # radio coverage, reports
  "6.b3": [technician, dispatcher]           # restarts in flight
