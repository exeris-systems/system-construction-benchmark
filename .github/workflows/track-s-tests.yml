name: track-s-tests
on:
  pull_request:
    paths: ["trackS/**", "contract/**", ".github/workflows/track-s-tests.yml"]
  push:
    branches: [main]
    paths: ["trackS/**", "contract/**", ".github/workflows/track-s-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      # Standard library only; a stubbed transport, so no network and no API key.
      - run: python3 -I trackS/test_run_track_s.py
      - run: python3 -I trackS/run-track-s.py persona-control --persona-model ministral-8b-2512 --dry-run
      - run: python3 -I trackS/run-track-s.py persona-holdout --persona-model ministral-8b-2512 --dry-run
      - run: python3 -I trackS/run-track-s.py persona-holdout-2 --persona-model ministral-14b-2512 --dry-run
      - run: python3 -I trackS/run-track-s.py persona-holdout-3 --persona-model ministral-8b-2512 --persona-check --dry-run
      - run: python3 -I trackS/run-track-s.py persona-holdout-4 --persona-model ministral-8b-2512 --persona-check --dry-run
      - run: python3 -I trackS/run-track-s.py persona-holdout-5 --persona-provider gemini --persona-model gemini-3.5-flash-lite --dry-run
      - run: python3 -I trackS/run-track-s.py grader-control --grader-provider gemini --grader-model gemini-3.8-flash --dry-run
      - run: python3 -I trackS/run-track-s.py judge-control --judge-provider gemini --judge-model gemini-4-argon --judge-temperature 0 --judge-seed 1 --dry-run
      - run: python3 -I trackS/run-track-s.py judge-control --judge-provider anthropic --judge-model claude-opus-5-5 --judge-effort high --dry-run
      - run: python3 -I trackS/run-track-s.py ceiling --judge-provider anthropic --judge-model claude-opus-5-5 --judge-effort high --dry-run
      - run: python3 -I trackS/run-track-s.py subject-naive --subject-provider anthropic --subject-model claude-opus-5-5 --persona-provider gemini --persona-model gemini-3.5-flash-lite --dry-run
      - run: python3 -I trackS/run-track-s.py subject-instructed --subject-provider gemini --subject-model gemini-4-argon --persona-provider gemini --persona-model gemini-3.5-flash-lite --dry-run
      - run: python3 -I trackS/run-track-s.py follow-up-control --judge-provider gemini --judge-model gemini-4-argon --judge-temperature 0 --judge-seed 1 --dry-run
